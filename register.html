<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UIU Lost & Found - Register</title>
    <link rel="stylesheet" href="register.css">
        <link rel="icon" type="image/png" href="logo.png">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<nav class="navbar">
    <ul class="nav-links">
        <li><a href="index.html"><i class="fa-solid fa-house"></i></a></li>
    </ul>
</nav>
<body>
    <div class="register-card">
    <h2>Create an Account</h2>
    <form action="php/register.php" method="post">
      <div class="form-group">
        <label for="id">Student ID</label>
        <input type="text" name="id" id="id" placeholder="Enter your student ID" required>
      </div>
      <div class="form-group">
        <label for="full_name">Full Name</label>
        <input type="text" name="full_name" id="full_name" placeholder="Enter your full name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="Enter your password" required>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" name="password" id="confirm_password" placeholder="Enter your password again" required>
      </div>
      <button type="submit" class="btn" >Register</button>
    </form>
    <p class="login-link">
      Already have an account? <a href="login.html">Sign in</a>
    </p>
  </div>
</body>
</html>
